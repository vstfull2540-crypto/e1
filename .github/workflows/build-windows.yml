name: Build EQ AI Mix Vocals Full VST3 (Windows)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64 VST3
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release VST3
        run: cmake --build build --config Release --target EQ_AI_Mix_Vocals_Full_VST3 --parallel

      - name: Locate VST3 bundle
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" |
            Where-Object { $_.FullName -match "Release" } |
            Select-Object -First 1
          if (-not $bundle) {
            $bundle = Get-ChildItem -Path build -Recurse -Directory -Filter "*.vst3" |
              Select-Object -First 1
          }
          if (-not $bundle) { throw "VST3 bundle was not produced." }
          "VST3_PATH=$($bundle.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: EQ-AI-Mix-Vocals-Full-Windows-x64-VST3
          path: ${{ env.VST3_PATH }}
          if-no-files-found: error
          compression-level: 9
